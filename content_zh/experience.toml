- 分析亚马逊商品的评分与评论数据，识别关键模式、关系和指标等，并挖掘潜在功能设计及为公司制定电商销售策略，以提高产品信誉和销量。
- 组织团队合理规划时间与任务安排，搜集文献并设计总体建模方案，撰写和检查最终论文。
'''

